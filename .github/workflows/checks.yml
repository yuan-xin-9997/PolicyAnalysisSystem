name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest src/tests/backend src/tests/smoke -q
        env:
          PYTHONPATH: src/app/backend
      - run: python -m ruff check src/app/backend src/tests/backend
      - run: python -m ruff format --check src/app/backend src/tests/backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/app/frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
      # Browser tests use the existing mocked API, without private services.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: src/app/frontend/test-results/
          retention-days: 7
